services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: growup
      POSTGRES_USER: growup
      POSTGRES_PASSWORD: growup_local_only
    volumes:
      - growup_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growup -d growup"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: growup
      DB_USER: growup
      DB_PASSWORD: growup_local_only
      FRONTEND_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  growup_postgres:
